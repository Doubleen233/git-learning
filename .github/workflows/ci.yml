name: CI

# 由 compile 标签触发（学员在 PR 评论 compile → compile-trigger.yml 自动打标签）。
# 必须用 pull_request 事件：GitHub 只承认 push / pull_request / pull_request_target
# 触发的检查项作为分支保护的"必需检查"，issue_comment 触发的检查不算。
on:
  pull_request:
    types: [labeled]

# 只读权限：跑的是 PR 代码，绝不能给写权限或 secrets。
permissions:
  contents: read

jobs:
  build-and-test:
    name: 编译与测试
    if: github.event.label.name == 'compile'
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 打印检出版本（诊断用，稳定后可删）
        run: |
          echo "PR #${{ github.event.pull_request.number }}"
          git log -1 --oneline
          ls -1 submit/ || true

      - name: 确认编译器可用
        run: g++ --version

      - name: 编译并测试 submit 下的代码
        run: bash scripts/run_tests.sh

  check-docs:
    name: 检查文档规范
    if: github.event.label.name == 'compile'
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 检查 submit 下的作业文档
        run: bash scripts/check_readme.sh

  check-submit:
    name: 检查提交规范
    if: github.event.label.name == 'compile'
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 检查目录命名
        run: bash scripts/check_submit.sh
